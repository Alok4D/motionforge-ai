<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mfGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="#0B0F19"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="url(#mfGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Kinetic Motion Waves / Forge Wings -->
  <g filter="url(#glow)">
    <!-- Left Forge Wing / M stroke -->
    <path d="M14 44V20L25 35L32 25" stroke="url(#mfGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Forge Flare / F stroke & Kinetic Sparks -->
    <path d="M32 25L39 35L50 20V44" stroke="url(#mfGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Energy Catalyst -->
    <circle cx="32" cy="25" r="3.5" fill="url(#coreGlow)"/>
    <circle cx="25" cy="35" r="2.5" fill="#00F0FF"/>
    <circle cx="39" cy="35" r="2.5" fill="#EC4899"/>
    
    <!-- Kinetic Orbit Ring -->
    <ellipse cx="32" cy="36" rx="20" ry="7" stroke="url(#mfGrad)" stroke-width="1.8" stroke-dasharray="2 4" stroke-opacity="0.75" transform="rotate(-15 32 36)"/>
  </g>
</svg>
