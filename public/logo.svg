<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="mfGradFull" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="forgeGlowBg" cx="60" cy="60" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="120" height="120" rx="30" fill="#0B0F19"/>
  <circle cx="60" cy="60" r="45" fill="url(#forgeGlowBg)"/>
  <rect x="1" y="1" width="118" height="118" rx="29" stroke="url(#mfGradFull)" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Kinetic Forge Emblem -->
  <g filter="url(#glowFull)">
    <!-- Dynamic Forge Anvil & Motion Paths -->
    <path d="M26 82V38L47 67L60 48" stroke="url(#mfGradFull)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 48L73 67L94 38V82" stroke="url(#mfGradFull)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Orbital Energy Core -->
    <circle cx="60" cy="48" r="6" fill="#FFFFFF"/>
    <circle cx="60" cy="48" r="3" fill="#00F0FF"/>
    
    <!-- Kinetic Pulse Arc -->
    <ellipse cx="60" cy="68" rx="38" ry="14" stroke="url(#mfGradFull)" stroke-width="3" stroke-dasharray="4 6" stroke-opacity="0.8" transform="rotate(-15 60 68)"/>
  </g>
</svg>
